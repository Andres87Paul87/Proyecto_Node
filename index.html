<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario</title>
    
</head>
<body>
    <header>
        <h1>Aplicación de Gestión de Inventario</h1>
    </header>
    <main>
        <section id="product-form">
            <h2>Añadir Nuevo Producto</h2>
            <form>
                <input type="text" id="product-name" placeholder="Nombre del Producto" required>
                <input type="text" id="product-description" placeholder="Descripción del Producto" required>
                <button type="submit" id="add-product">Añadir Producto</button>
            </form>
        </section>
        <section id="product-list">
            <h2>Inventario Actual</h2>
            <ul id="inventory"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Gestión de Inventario. Todos los derechos reservados</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
